version: '3.8'

# ============================================================
# Docker Compose - Portal CDC UM Kendari
# Local Development Database (mirrors Supabase PostgreSQL)
# ============================================================
#
# CARA PAKAI:
#   1. Jalankan:  docker-compose up -d
#   2. Ganti DATABASE_URL di .env ke URL lokal:
#      postgresql://cdcadmin:cdcumk2026@localhost:5433/portal_cdc
#   3. Jalankan migrasi: npx prisma migrate dev
#   4. Untuk koneksi ke Supabase, gunakan URL Supabase di .env
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL Database (Local Mirror)
  # ----------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: portal_cdc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_cdc
      POSTGRES_USER: cdcadmin
      POSTGRES_PASSWORD: cdcumk2026
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"       # Map ke port 5433 agar tidak bentrok dengan PostgreSQL lokal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro   # Auto-run SQL saat pertama kali
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdcadmin -d portal_cdc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cdc_network

  # ----------------------------------------------------------
  # Adminer (GUI Database Manager - akses via browser)
  # URL: http://localhost:8080
  # Server: db | User: cdcadmin | Password: cdcumk2026 | DB: portal_cdc
  # ----------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: portal_cdc_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cdc_network

# ----------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------
volumes:
  postgres_data:
    name: portal_cdc_postgres_data

networks:
  cdc_network:
    name: portal_cdc_network
    driver: bridge
